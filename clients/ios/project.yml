# XcodeGen spec. The .xcodeproj is generated (never committed): `xcodegen generate`.
name: Aleph
options:
  bundleIdPrefix: com.mattjmcnaughton.aleph
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"

targets:
  Aleph:
    type: application
    platform: iOS
    sources: [Aleph]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattjmcnaughton.aleph.app
        PRODUCT_NAME: Aleph
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: aleph
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  AlephSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AlephSnapshotTests]
    dependencies:
      - target: Aleph
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mattjmcnaughton.aleph.snapshottests

  AlephUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AlephUITests]
    dependencies:
      - target: Aleph
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mattjmcnaughton.aleph.uitests
        TEST_TARGET_NAME: Aleph

schemes:
  Aleph:
    build:
      targets:
        Aleph: all
    test:
      gatherCoverageData: false
      targets:
        - AlephSnapshotTests
        - AlephUITests
