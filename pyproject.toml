[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aleph"
version = "0.1.0"
description = "Mobile-friendly AI tutor: name a topic, get a generated learning path"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Matt McNaughton", email = "mattjmcnaughton@users.noreply.github.com" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "structlog>=24.0",
    "pydantic-settings>=2.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-exporter-otlp>=1.20",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "opentelemetry-instrumentation-sqlalchemy>=0.44b0",
    "pydantic-ai-slim[openai]>=2.5.0",
    "authlib>=1.7.2",
    "itsdangerous>=2.2.0",
    "logfire[fastapi,httpx,sqlalchemy]>=4.37",
    # Direct dependency as of AL-523: `services/retrieval.py`'s `ExaRetriever`
    # imports `httpx` at module level. It already resolved transitively (via
    # `logfire[httpx]`/`pydantic-ai`), but a top-level import reachable from
    # production should not depend on another package's extra staying exactly
    # as configured (the same fragility `_load_fixture`'s pyyaml note in that
    # module records and deliberately avoids by importing pyyaml locally).
    "httpx>=0.28",
]

[project.urls]
Repository = "https://github.com/mattjmcnaughton/aleph"

# The wheel ships exactly one thing: the application package. Stated explicitly
# (rather than left to hatchling's src-layout auto-detection) because it is the
# load-bearing half of the "evals/ never ships" guarantee — `evals/`, `tests/`,
# `scripts/` and `docs/` are peers of `src/`, so none of them can be swept in.
# `tests/unit/test_packaging.py` asserts this contract.
[tool.hatch.build.targets.wheel]
packages = ["src/aleph"]

[tool.uv]
exclude-newer = "2026-07-23T00:00:00Z"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "ty>=0.0.54",
    # Dev environments include the eval-harness deps so `just gate` (ruff, ty,
    # unit tests) can see `evals/` without a separate sync. Eval *runs* stay
    # opt-in (`just evals`); only the deps ride along here.
    { include-group = "evals" },
]
# Agent eval harness (evals/, docs/evals.md). A separate group so the Evals CI
# job installs a minimal env (`uv sync --no-dev --group evals`); the exact
# version is pinned by uv.lock. The floor stays at 2.9.0 rather than the locked
# version: [tool.uv] exclude-newer caps fresh resolutions, and an implicit
# `uv run` re-resolve must stay satisfiable under that window.
evals = [
    "pydantic-evals>=2.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "legacy"
addopts = "--strict-markers"
markers = [
    "external: tests that hit external services (opt-in via `just test-external`; never run in CI)",
    "workflow(id): marks a test that proves a named PRD workflow (e.g. workflow(\"W1\")); shared vocabulary only, no enforcement machinery (TDD §12)",
]
