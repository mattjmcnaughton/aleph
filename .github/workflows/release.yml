name: Release

# Two ways in, and only one of them can ship:
#
#   workflow_run  — the real pipeline, and the *only* path that tags, publishes,
#                   builds, or deploys. A green CI run on `main` is the sole
#                   trigger, so a red gate can never reach production.
#   workflow_dispatch — rehearsal only. Hardcoded to `--dry-run`; there is no
#                   input to flip. Asking a human not to tick a box is not a
#                   control — a dispatched release would be a full deploy that
#                   never faced the CI gate, so the button simply cannot do it.
#
# The rehearsal is doubly fenced: semantic-release never reaches its publish step
# under `--dry-run`, so the `@semantic-release/exec` plugin never sets
# `new-release-published`; and the image/deploy jobs additionally require
# `github.event_name == 'workflow_run'`, which a dispatch can never satisfy.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic.outputs.new-release-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the commit analyzer reads every commit since the last
          # tag to decide the bump.
          #
          # This checks out `main`'s tip, which can in principle be a commit
          # newer than the SHA the triggering CI run tested. `ci.yml` sets
          # `cancel-in-progress` on `ci-${{ github.ref }}`, so a push that lands
          # during a CI run cancels it — a cancelled run is not `success` and
          # never triggers this workflow. The release therefore follows the last
          # CI run that both finished and stayed green.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      # The repo-root package.json holds the semantic-release toolchain only; the
      # frontend has its own manifest under src/aleph/web/frontend.
      - name: Install release dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::notice::dispatch is rehearsal-only — planning the next release, publishing nothing"
            pnpm exec semantic-release --dry-run
          else
            pnpm exec semantic-release
          fi

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: release
    # The one fence, stated once and reused verbatim by `deploy` below: a release
    # was actually published (impossible under the dispatch's `--dry-run`) *and*
    # we got here from a green CI run rather than the rehearsal button.
    if: >
      needs.release.outputs.new-release-published == 'true' &&
      github.event_name == 'workflow_run'

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new-release-version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.new-release-version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.new-release-version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.new-release-version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: release
    # Same fence as `image` above.
    if: >
      needs.release.outputs.new-release-published == 'true' &&
      github.event_name == 'workflow_run'
    concurrency: deploy-aleph

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new-release-version }}

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Fly builds the image itself from this checkout (`--remote-only`); the
      # GHCR push above is an artifact mirror, not the deploy source. See
      # docs/deploy.md.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --app aleph --remote-only
