name: Configure Web Push once

# Remove this workflow after successful provisioning. Never remove the Fly key.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type enable-web-push to set the production key and restart web Machines"
        required: true
        type: string

permissions:
  contents: read

jobs:
  configure:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'enable-web-push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize with the existing production deploy; never cancel an active write.
    concurrency:
      group: deploy-aleph-prod-mattjmcnaughton
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install locked dependencies without production credentials
        run: uv sync --frozen --no-dev --python 3.12

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.120"

      - name: Generate, stage and deploy VAPID key without logging it
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NO_COLOR: "1"
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import base64
          import json
          import os
          import subprocess

          from cryptography.hazmat.primitives.asymmetric import ec

          APP = "aleph-prod-mattjmcnaughton"

          def check_existing(secrets):
              if not isinstance(secrets, list) or not all(
                  isinstance(item, dict) and isinstance(item.get("name"), str)
                  for item in secrets
              ):
                  raise SystemExit("Unrecognized secret inventory; no changes made.")
              if any(item["name"] in {"VAPID_PRIVATE_KEY", "VAPID_PUBLIC_KEY"} for item in secrets):
                  raise SystemExit("VAPID configuration already exists; refusing rotation. No changes made.")
              if any(item.get("status") != "Deployed" for item in secrets):
                  raise SystemExit("Existing secrets have pending/unknown deployment; resolve first. No changes made.")

          def fly(*args, payload=None, capture=False):
              # Never expose CLI output, even on failure: errors can echo input.
              result = subprocess.run(
                  ["flyctl", "secrets", *args, "--app", APP],
                  input=payload,
                  text=True,
                  stdout=subprocess.PIPE if capture else subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if result.returncode:
                  raise SystemExit(
                      "Fly secret operation failed. The write may have succeeded; "
                      "inspect secret names/status before retrying. Do not rotate keys."
                  )
              return result.stdout

          if not os.environ.get("FLY_API_TOKEN"):
              raise SystemExit("FLY_API_TOKEN is unavailable; no changes made.")
          check_existing(json.loads(fly("list", "--json", capture=True)))
          key = ec.generate_private_key(ec.SECP256R1())
          private = base64.urlsafe_b64encode(
              key.private_numbers().private_value.to_bytes(32, "big")
          ).rstrip(b"=").decode("ascii")
          # The application derives the public key. Nothing is saved to disk,
          # argv, GitHub outputs/artifacts, or a new GitHub secret.
          fly("import", "--stage", payload=f"VAPID_PRIVATE_KEY={private}\n")
          del private, key
          fly("deploy")
          inventory = json.loads(fly("list", "--json", capture=True))
          if not any(
              item.get("name") == "VAPID_PRIVATE_KEY" and item.get("status") == "Deployed"
              for item in inventory
          ):
              raise SystemExit("Key was submitted but web rollout is unconfirmed. Inspect Fly; do not generate another key.")
          print("VAPID key provisioned and deployed to web Machines. No key material was logged.")
          print("Non-Launch scheduled Machines receive the app secret on their next start; no job was forcibly restarted.")
          PY

      - name: Check public readiness
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 30 https://aleph.mattjmcnaughton.com/readyz
