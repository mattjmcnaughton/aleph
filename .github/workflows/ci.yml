name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate-expensive:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aleph
          POSTGRES_USER: aleph
          POSTGRES_PASSWORD: aleph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aleph -d aleph"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://aleph:aleph@localhost:5432/aleph
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/aleph/web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: src/aleph/web/frontend
        run: pnpm install --frozen-lockfile

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Run gate-expensive
        run: just gate-expensive
