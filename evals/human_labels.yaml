# The human-label calibration set (PRD §9, TDD §11) — read evals/agreement.py.
#
# The judge is a trusted gate only while judge↔human agreement is >= 90%
# (`just evals --agreement`). This file is the human half of that measurement:
# generations a builder looked at and marked pass/fail, with the artifact stored
# inline so the same labels can be re-run against a new judge prompt or a new
# judge model months from now.
#
# ============================ EVERY LABEL HERE IS A SAMPLE ===================
# `sample: true` on all of them, and it is not decoration. AL-082 delivers the
# schema, the runner and the arithmetic; the labels themselves are builder work
# that CANNOT be invented — a fabricated "human" verdict would produce an
# agreement figure that measures the fabricator, not the judge. The runner
# refuses to treat an all-sample file as a calibration measurement and says so.
# PRD §9 asks for ~30-50 real labels; these seven show the shape and exercise
# the machinery. Replace them (or set `sample: false` as real ones are
# recorded) — while the file is MIXED, the gate is computed over the
# `sample: false` labels alone and the samples are reported separately, so a
# real label starts counting the moment its flag flips and never has its
# verdict averaged with a fabricated one.
# =============================================================================
#
# Schema, per label:
#   id        unique, kebab-case; the report's row id
#   sample    REQUIRED true/false: true while illustrative rather than
#             builder-recorded. Samples are judged and printed but excluded
#             from the gated agreement figure
#   source    the artifact ref — where this generation came from
#   note      why the human called it this way (the calibration signal)
#   artifact  outline | lesson — selects the rubric item set that applies
#   topic     the learner's topic, as given to the outline agent
#   level     beginner | intermediate | advanced
#   outline   the path outline (the artifact for `outline`, context for `lesson`)
#   lesson    the lesson under review: slot + content + prior Read passages
#   overall   the human's pass/fail — the headline agreement is computed on this
#   items     OPTIONAL per-rubric-item pass/fail; must imply the same `overall`
#   smoke     what the OFFLINE stub judge should report (`--smoke --agreement`
#             only, never a live run) — see agreement.SmokeScript
#
# Read passages below are ABRIDGED for legibility; a real one is 200-500 words
# (§14). The judge does not enforce the word band — that is Layer 1's job — so
# abridging changes nothing about the verdicts.
version: 1
labels:

