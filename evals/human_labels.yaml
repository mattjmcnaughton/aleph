# --- lessons -------------------------------------------------------------------

- id: sample-lesson-sql-miskeyed-check
  sample: true
  source: hand-written probe modelled on seed-set case `sql-query-performance`
  note: >-
    The passage teaches correctly and then keys the wrong option, with an
    explanation that contradicts its own passage. Two items fail for one defect,
    which is intended — `check_validity` is about the MCQ's internal coherence
    and `accurate` about the claim the explanation makes.
  artifact: lesson
  topic: SQL query performance tuning
  level: intermediate
  outline:
    units:
    - title: How the planner chooses
      summary: What the query planner is deciding and on what evidence.
      lessons:
      - title: Reading an EXPLAIN plan
      - title: Statistics and cardinality estimates
      - title: When an index is not used
    - title: Fixing slow queries
      summary: The changes that actually move the needle.
      lessons:
      - title: Covering indexes
      - title: Rewriting predicates to be sargable
  lesson:
    position_in_path: 3
    unit_title: How the planner chooses
    lesson_title: When an index is not used
    prior_passages:
    - unit_title: How the planner chooses
      lesson_title: Reading an EXPLAIN plan
      read_passage: >-
        (abridged) An EXPLAIN plan is the planner showing its work: each node is
        an operation, and the estimated cost and row count tell you what it
        expected to happen. Read it from the innermost node outwards.
    - unit_title: How the planner chooses
      lesson_title: Statistics and cardinality estimates
      read_passage: >-
        (abridged) The planner's choices are only as good as its statistics. A
        stale histogram makes it expect a hundred rows where a million arrive,
        and every decision downstream of that estimate inherits the error.
    content:
      read_passage: >-
        (abridged) An index can exist and still go unused. The commonest reason
        is a non-sargable predicate: wrapping the indexed column in a function
        means the stored values no longer match what the predicate compares, so
        the planner falls back to a sequential scan. WHERE lower(email) = ?
        cannot use a plain B-tree index on email, because the index holds the
        raw values and not their lowercased form. The fix is to index the
        expression itself, or to normalise the data on the way in so the plain
        column index is enough.
      quick_check:
        stem: Why can `WHERE lower(email) = ?` not use a plain B-tree index on `email`?
        options:
        - The index stores the raw column values, not `lower(email)`
        - B-tree indexes cannot serve equality predicates
        - The planner never uses an index on a text column
        correct_index: 1
        explanation: B-tree indexes only support range scans, never equality.
  overall: fail
  items:
    accurate: fail
    level_appropriate: pass
    in_scope: pass
    continuous: pass
    check_validity: fail
    safe: pass
  smoke:
    judge_fails: [accurate, check_validity]

- id: sample-lesson-rust-reteaches-lesson-one
  sample: true
  source: hand-written probe modelled on seed-set case `rust-ownership`
  note: >-
    Correct, safe, on-topic prose that a rubric without a continuity item would
    happily pass — it just spends lesson 2 re-teaching lesson 1 to an advanced
    learner. Judging this needs lesson 1's passage in context, which is exactly
    what the continuity item and full-path sequential generation exist for.
  artifact: lesson
  topic: Rust ownership, borrowing, and lifetimes
  level: advanced
  outline:
    units:
    - title: Ownership in practice
      summary: Moves, borrows, and the rules the compiler enforces.
      lessons:
      - title: Moves and the drop order
      - title: Shared and mutable borrows
      - title: Reborrowing through a &mut
    - title: Lifetimes
      summary: Naming and relating the regions references are valid for.
      lessons:
      - title: Lifetime elision rules
      - title: Higher-ranked trait bounds
  lesson:
    position_in_path: 2
    unit_title: Ownership in practice
    lesson_title: Shared and mutable borrows
    prior_passages:
    - unit_title: Ownership in practice
      lesson_title: Moves and the drop order
      read_passage: >-
        (abridged) Every value in Rust has exactly one owner, and when the owner
        goes out of scope the value is dropped. Assigning a non-Copy value moves
        ownership rather than copying it, which is why the original binding is
        no longer usable afterwards. Drop order within a scope is reverse
        declaration order, and that matters as soon as one value borrows from
        another.
    content:
      read_passage: >-
        (abridged) Every value in Rust has exactly one owner. When that owner
        goes out of scope, the value is dropped. Assigning a non-Copy value to
        another binding moves ownership rather than copying, so the original
        binding can no longer be used — this is the single idea the borrow
        checker is built around, and it is worth restating carefully before
        going further. Values are dropped in reverse declaration order within a
        scope. With that established, note that references come in two kinds,
        shared and mutable.
      quick_check:
        stem: What happens to the original binding when a non-Copy value is assigned elsewhere?
        options:
        - It is moved, and the original binding can no longer be used
        - It is copied, and both bindings remain usable
        - It is borrowed for the rest of the scope
        correct_index: 0
        explanation: Assignment of a non-Copy value moves ownership out of the original binding.
  overall: fail
  items:
    accurate: pass
    level_appropriate: fail
    in_scope: fail
    continuous: fail
    check_validity: pass
    safe: pass
  # Deliberately scripted to PASS offline while the human failed it: this is the
  # one sample that makes `--smoke --agreement` exercise the judge-lenient
  # direction — a judge shipping what a human rejected, the disagreement that
  # actually invalidates a green gate.
  smoke:
    judge_fails: []

- id: sample-lesson-sourdough-second-lesson
  sample: true
  source: hand-written probe modelled on seed-set case `sourdough-baking`
  note: >-
    The friendly baseline: an ordinary second lesson that builds on the first
    without repeating it, with a Quick check answerable from its own passage.
    A regression that starts failing this one is a judge problem, not a
    generation problem.
  artifact: lesson
  topic: Baking sourdough bread at home
  level: beginner
  outline:
    units:
    - title: Starter and fermentation
      summary: How a wild-yeast starter works and how to keep one alive.
      lessons:
      - title: What a sourdough starter is
      - title: Feeding schedules and hydration
      - title: Reading the signs of an active starter
    - title: Mixing and bulk fermentation
      summary: Turning flour, water and starter into a developed dough.
      lessons:
      - title: Autolyse and mixing by hand
      - title: Stretch and fold
  lesson:
    position_in_path: 2
    unit_title: Starter and fermentation
    lesson_title: Feeding schedules and hydration
    prior_passages:
    - unit_title: Starter and fermentation
      lesson_title: What a sourdough starter is
      read_passage: >-
        (abridged) A sourdough starter is a stable culture of wild yeasts and
        lactic acid bacteria living in a paste of flour and water. The yeasts
        make the gas that lifts your loaf and the bacteria make the acids that
        give it flavour and keep competitors out.
    content:
      read_passage: >-
        (abridged) Now that you have a culture, the job is keeping it fed. A
        feed means discarding most of the starter and replacing what you kept
        with fresh flour and water, which resets the food supply before the
        culture exhausts it. Bakers describe a feed as a ratio — 1:5:5 means one
        part starter to five parts each of flour and water. Hydration is the
        weight of water as a percentage of the flour: a 100% hydration starter
        is equal weights of both and behaves like a thick batter, while a
        stiffer 50% starter ferments more slowly and keeps longer between feeds.
        Warmer kitchens speed everything up, so the same schedule that works in
        summer may leave a winter starter sluggish.
      quick_check:
        stem: What does a "100% hydration" starter mean?
        options:
        - Equal weights of flour and water
        - Twice as much water as flour
        - A starter fed only with water
        correct_index: 0
        explanation: Hydration is water weight as a percentage of flour weight, so 100% is equal weights.
  overall: pass
  items:
    accurate: pass
    level_appropriate: pass
    in_scope: pass
    continuous: pass
    check_validity: pass
    safe: pass
  smoke:
    judge_fails: []
